<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliente · PedidosExpress</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">🛒 Cliente</div>
  <nav>
    <a href="index.html">inicio</a>
    <a class="activo" href="cliente.html">cliente</a>
    <a href="manager.html">manager</a>
    <a href="devtools.html">devtools</a>
  </nav>
  <span class="dim">tu pedido viaja al mismo backend simulado que el manager</span>
</header>

<main>
  <div id="order-chip"></div>
  <div class="shop">
    <div>
      <div id="prod-grid"></div>
    </div>
    <div class="card side-card">
      <h3>Tu pedido</h3>
      <div id="cart-list"></div>
      <div class="cart-total-row"><span>Total</span><span id="cart-total">$0.00</span></div>
      <form id="checkout-form">
        <label for="f-name">Nombre</label>
        <input id="f-name" placeholder="Ana Torres" required>
        <label for="f-phone">Teléfono</label>
        <input id="f-phone" placeholder="555-0101" required>
        <label for="f-addr">Dirección de entrega</label>
        <input id="f-addr" placeholder="Calle 1 #23" required>
        <label for="f-note">Nota (opcional)</label>
        <input id="f-note" placeholder="tocar el timbre dos veces">
        <label for="f-pay">Método de pago</label>
        <select id="f-pay">
          <option value="efectivo">Efectivo al entregar</option>
          <option value="tarjeta">Tarjeta (pasarela simulada)</option>
        </select>
        <div class="check">
          <input type="checkbox" id="f-decline">
          <label for="f-decline" style="margin:0">demo: forzar rechazo de pago</label>
        </div>
        <button id="btn-checkout" class="btn primary" type="submit" style="width:100%">Confirmar pedido</button>
      </form>
    </div>
  </div>
</main>

<div id="modal"><div class="modal-card" id="modal-body"></div></div>

<script src="core.js"></script>
<script>
'use strict';
let cart = {};               // pid -> cantidad
let lastOrderId = null;
let lastSeenStatus = null;
let busy = false;

const prod = id => Core.prod(id);
const cartCount = () => Object.values(cart).reduce((s, n) => s + n, 0);
const cartTotal = () => Object.entries(cart).reduce((s, [pid, q]) => s + prod(pid).price * q, 0);

function renderTienda() {
  document.getElementById('prod-grid').innerHTML = Core.db.products.map(p => `
    <div class="prod-card">
      <div class="prod-emoji">${p.emoji}</div>
      <div class="prod-name">${Core.esc(p.name)}</div>
      <div class="prod-price">${Core.money(p.price)}</div>
      <div class="prod-stock ${p.stock <= Core.LOW ? 'low' : ''}">${p.stock > 0 ? p.stock + ' u disponibles' : 'agotado'}</div>
      <button class="btn primary" data-add="${p.id}" ${p.stock <= 0 || cart[p.id] >= p.stock ? 'disabled' : ''}>Agregar</button>
    </div>`).join('');

  const o = lastOrderId && Core.db.orders.find(x => x.id === lastOrderId);
  const chip = document.getElementById('order-chip');
  chip.style.display = o ? '' : 'none';
  if (o) chip.innerHTML = `Último pedido: <b>${o.id}</b> · <span class="st st-${o.status}">${Core.STATUS_TXT[o.status]}</span>`;
}

function renderCart() {
  const entries = Object.entries(cart);
  document.getElementById('cart-list').innerHTML = entries.length ? entries.map(([pid, q]) => {
    const p = prod(pid);
    return `<div class="cart-row">
      <span class="cart-name">${p.emoji} ${Core.esc(p.name)}</span>
      <span class="cart-qty"><button data-dec="${pid}">−</button> ${q} <button data-inc="${pid}">+</button></span>
      <span class="cart-sub">${Core.money(p.price * q)}</span>
      <button class="x" data-del="${pid}" title="quitar">✕</button>
    </div>`;
  }).join('') : '<div class="empty">Carrito vacío</div>';
  document.getElementById('cart-total').textContent = Core.money(cartTotal());
  document.getElementById('btn-checkout').disabled = !entries.length || busy;
}

function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('modal').style.display = 'none';
  });
}

// cuando otra app (el manager) cambia algo, esta pestaña se entera por el bus
Core.onSync(() => {
  renderTienda();          // stock en vivo
  renderCart();            // por si acaso el stock cambió
  const o = lastOrderId && Core.db.orders.find(x => x.id === lastOrderId);
  if (o && lastSeenStatus && o.status !== lastSeenStatus) {
    Core.toast(`🚚 Tu pedido ${o.id}: ${Core.STATUS_TXT[o.status]}`);
    lastSeenStatus = o.status;
  }
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-inc],[data-dec],[data-del]');
  if (!t) return;
  if (t.dataset.add) {
    const p = prod(t.dataset.add);
    cart[p.id] = (cart[p.id] || 0) + 1;
    Core.flow('web', `carrito: +1 ${p.name}`);
  } else if (t.dataset.inc) {
    const p = prod(t.dataset.inc);
    if (cart[p.id] < p.stock) { cart[p.id]++; Core.flow('web', `carrito: +1 ${p.name}`); }
  } else if (t.dataset.dec) {
    const p = prod(t.dataset.dec);
    cart[p.id] = Math.max(0, (cart[p.id] || 0) - 1);
    if (!cart[p.id]) delete cart[p.id];
    Core.flow('web', `carrito: -1 ${p.name}`);
  } else if (t.dataset.del) {
    const p = prod(t.dataset.del);
    delete cart[p.id];
    Core.flow('web', `carrito: quitar ${p.name}`);
  }
  renderCart(); renderTienda();
});

document.getElementById('checkout-form').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy || !cartCount()) return;
  const draft = {
    name: document.getElementById('f-name').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    address: document.getElementById('f-addr').value.trim(),
    note: document.getElementById('f-note').value.trim(),
    payMethod: document.getElementById('f-pay').value,
    forceDecline: document.getElementById('f-decline').checked,
    items: Object.entries(cart).map(([pid, qty]) => { const p = prod(pid); return { pid, name: p.name, price: p.price, qty }; }),
  };
  if (!draft.name || !draft.phone || !draft.address) return Core.toast('⚠️ Completa nombre, teléfono y dirección');

  busy = true; renderCart();
  const btn = document.getElementById('btn-checkout'); btn.textContent = 'Procesando…';
  try {
    const res = await Core.placeOrder(draft);
    if (res.ok) {
      lastOrderId = res.order.id;
      lastSeenStatus = res.order.status;
      cart = {};
      Core.flow('cliente', `confirma ${res.order.id} 🎉`);
      openModal(`
        <h3>✅ Pedido ${res.order.id} confirmado</h3>
        <p>${res.order.items.map(it => `${it.qty}× ${Core.esc(it.name)}`).join('<br>')}</p>
        <p>Total: <b>${Core.money(res.order.total)}</b> · Pago: ${res.order.payStatus}</p>
        <p class="dim">Deja esta pestaña abierta: cuando el manager avance tu pedido, te llega un aviso aquí.</p>
        <button class="btn primary" id="modal-close" style="width:100%">Listo</button>`);
      e.target.reset();
    } else {
      openModal(`
        <h3>❌ Pago rechazado</h3>
        <p>${Core.esc(res.reason)}</p>
        <p class="dim">Demo: la pasarela simulada rechaza si marcas la casilla, o al azar el 10% de las veces. El carrito se conserva para que reintentes.</p>
        <button class="btn primary" id="modal-close" style="width:100%">Entendido</button>`);
    }
  } catch (err) {
    Core.toast('⚠️ ' + err.message);
  }
  busy = false; btn.textContent = 'Confirmar pedido';
  renderCart(); renderTienda();
});

renderTienda();
renderCart();
</script>
</body>
</html>
